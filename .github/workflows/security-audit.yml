name: Security audit

on:
  push:
    paths: [Cargo.toml, Cargo.lock, .github/workflows/security-audit.yml]
  pull_request:
  schedule:
    # Advisories are published against dependencies that have not changed, so this also runs weekly.
    - cron: "0 7 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check for known vulnerabilities
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
