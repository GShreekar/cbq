# Checked in CI by cargo-deny; see .github/workflows/security-audit.yml

[licenses]
# Permissive licences only: cbq is MIT, and a copyleft dependency would change what users may do with it.
# CC0-1.0 is a public-domain dedication, so it asks less of users than MIT does. It grants no patent
# rights, which is why some company policies exclude it; that is not a constraint cbq works under.
# CDLA-Permissive-2.0 covers webpki-roots, which packages Mozilla's list of root certificates. It is a
# licence for data rather than code, and it permits use and redistribution.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
    "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
