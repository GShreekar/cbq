[package]
name = "cbq"
version = "1.0.1"
edition = "2024"
description = "Local-first codebase semantic Q&A and analysis CLI tool"
license = "MIT"
repository = "https://github.com/GShreekar/cbq"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ignore = "0.4"
indicatif = "0.17"
colored = "2.1"
anyhow = "1.0"
tree-sitter = "0.26"
tree-sitter-language-pack = "1.9.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
