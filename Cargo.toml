[package]
name = "cbq"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
ignore = "0.4"
indicatif = "0.17"
colored = "2.1"
anyhow = "1.0"
tree-sitter = "0.26"
tree-sitter-language-pack = "1.9.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
console = "0.15"
chrono = { version = "0.4", features = ["serde"] }
