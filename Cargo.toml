[package]
name = "cbq"
version = "1.0.1"
edition = "2024"
description = "Local-first codebase semantic Q&A and analysis CLI tool"
license = "MIT"
repository = "https://github.com/GShreekar/cbq"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.5"
ignore = "0.4"
indicatif = "0.17"
colored = "2.1"
anyhow = "1.0"
tree-sitter = "0.26"
tree-sitter-language-pack = "1.9.1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "process", "io-std", "io-util"] }
# No TLS by default: cbq talks to Ollama over plain HTTP, and linking OpenSSL would make
# installing cbq depend on system OpenSSL headers. `--features https` adds it back.
reqwest = { version = "0.11", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
termimad = "0.34"
rayon = "1.10"
# Already present through termimad; used directly for chat line editing.
crossterm = "0.29"
notify = "8"

[features]
# Lets ollama.host be an https:// address, at the cost of needing OpenSSL to build.
https = ["reqwest/default-tls"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
